        <nav class="navbar">

        <div class="title animated-title">
            <h1>Contacts</h1>
        </div>

        <div class="feedback contact-form-wrapper">
            <form class="fback" action="https://formbold.com/s/3ZeLp" method="POST">  
                <h2>Leave a message</h2>
                
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="John Doe" required>
                
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="example@here.com" required>
                
                <label for="message">Message:</label>
                <textarea id="message" name="message" maxlength="1000" placeholder="Enter Message..." required></textarea>
                
                <input type="submit" value="Send Message">
            </form>
        </div>

        <div class="social-footer-wrapper">
            <p class="random">And more...</p>
            <div class="contacts">
                <a href="https://github.com/ZeagaBG" target="_blank" class="socials">
                    <img src="./assets/GitHub_Invertocat_White.png" class="github" alt="GitHub profile">
                </a>
                <a href="https://discord.com/users/986907147453493259" target="_blank" class="socials">
                    <img src="./assets/discord@3x.png" class="discord" alt="Discord profile">
                </a>
                <a href="mailto:muratnasuf69@gmail.com" target="_blank" class="socials">
                    <img src="./assets/gmail.png" class="gmail" alt="Email">
                </a>
                <a href="https://www.tiktok.com/@muratech_" target="_blank" class="socials">
                    <img src="./assets/tiktok.png" class="tiktok" alt="Tiktok account">
                </a>
            </div>
